# ============================================================================================
# File      : Cargo.toml
# Author    : Marcus Schlieper
# Description:
# - Cross platform setup without mandatory torch-sys build.
# - Default path uses no native torch dependency.
# - Optional HTTP based embeddings can be enabled via existing dependencies only.
#
# History:
# 2026-05-08 MS - Initial cross platform stabilization proposal without mandatory torch-sys
# ============================================================================================

[package]
name = "expchat_web_gateway"
version = "0.1.0"
edition = "2021"
license = "MIT OR Apache-2.0"
authors = ["Marcus Schlieper"]
description = "ExpChat.ai AI chat client for SMB knowledge and search."
homepage = "https://expchat.ai"
repository = "https://github.com/ExpChat-ai/secure_p2p"

[dependencies]
console = { version = "0.16", default-features = true, features = ["ansi-parsing", "unicode-width"] }
tracing-subscriber = { version = "0.3.20", features = ["env-filter"] }

libp2p = { version = "0.56", default-features = false, features = [
    "tcp", "noise", "yamux",
    "mdns", "gossipsub", "identify", "kad", "ping",
    "tokio", "macros", "quic"
] }

tantivy = "0.19"
hnsw = { version = "0.11.0", features = ["serde"] }
pdf-text-extract = "0.2.0"
pdf-extract = "0.10.0"
lopdf = "0.40.0"
calamine = { version = "0.32", default-features = false }
zip = "0.6"

bincode = "1.3"
sled = "0.34"
smallvec = { version = "1.15", default-features = false, features = ["serde"] }

aes-gcm-siv = { version = "0.11", features = ["std"] }
rand = { version = "0.8", features = ["std_rng"] }
rand_core = "0.6"
blsttc = "8.0"
sha2 = "0.10"

tokio = { version = "1", features = ["full"] }
futures = "0.3"

anyhow = "1"
thiserror = "1"
humantime = "2"
chrono = "0.4"

serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

argon2 = "0.5"
hex = "0.4"
rpassword = "7"
axum = "0.7"
base64 = "0.21"


bytes = "1"
http = "1"
http-body-util = "0.1"
hyper = { version = "1", features = ["http1", "server"] }
hyper-util = { version = "0.1", features = ["tokio"] }
percent-encoding = "2"

reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
debug = false

[profile.dev]
debug = true
